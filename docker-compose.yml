version: "3.9"

services:
  backend_mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_mobile
    restart: unless-stopped
    ports:
      - "8082:8081"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"  # важно для Linux
    environment:
      # ✅ Подключаемся к УЖЕ запущенному Postgres из первого стека
      DB_HOST: host.docker.internal
      DB_PORT: 5433          # это host-port твоего старого Postgres (5433:5432)
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: autoteile_db  # общий DB (если хочешь реально общие данные)

      # ✅ Подключаемся к общим сервисам
      REDIS_URL: redis://host.docker.internal:6379
      QDRANT_URL: http://host.docker.internal:6333
      MINIO_ENDPOINT: host.docker.internal:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: autoteile
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: mobile.fixautoteile.de

      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/fix-autoscan-hub-463814-a285a546da5f.json

    volumes:
      - ./app:/app/app
      - ./secrets:/app/secrets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8081 --reload
    working_dir: /app

  sparrow_mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparrow_mobile
    restart: unless-stopped
    ports:
      - "8002:8001"
      - "8004:8003"
    environment:
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata/
    volumes:
      - ./entrypoint-sparrow.sh:/app/entrypoint.sh
    entrypoint: ["/app/entrypoint.sh"]
    working_dir: /app
